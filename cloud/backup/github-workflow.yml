# The daily backup of Kiwimake Cloud's production Convex deployment (docs/CLOUD.md section 3,
# "Running on Convex Starter"). This file goes to .github/workflows/convex-backup.yml in the
# PRIVATE backups repo, next to a copy of kiwi-backup.mjs and package.json (see README.md here).
#   Secret   CONVEX_PROD_EXPORT_KEY  a production deploy key that may export data
#   Variable BACKUP_PUBLIC_KEY       KWBK-PUBLIC-1:... from `node kiwi-backup.mjs keygen`
# Encrypted backups are kept as this repo's releases for 30 days (at least the newest 7).
# GitHub emails the repo's owner when a scheduled run fails.
name: Convex backup
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: convex-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: node kiwi-backup.mjs run
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_EXPORT_KEY }}
          BACKUP_PUBLIC_KEY: ${{ vars.BACKUP_PUBLIC_KEY }}
          BACKUP_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_KEEP_DAYS: "30"
          BACKUP_MIN_KEEP: "7"
